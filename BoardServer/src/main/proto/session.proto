syntax = "proto3";

package board;

service SessionAPI {
    rpc RegisterSession (stream EnterRequest) returns (stream UserStatus);
    rpc SubscribeUserSession (stream SubscribeRequest) returns (stream UserStatus);
}

message EnterRequest {
    string id = 1;
}

message UserStatus {
    string id = 1;
    bool is_online = 2;
    string last_seen = 3;
}

message SubscribeRequest {
    string id = 1;
    bool is_subscribe = 3;
}
